services:
  postgres:
    image: postgres:16-alpine
    container_name: pwm_postgres
    environment:
      POSTGRES_USER: pwm
      POSTGRES_PASSWORD: pwm_pass
      POSTGRES_DB: pwm_db
    ports:
      - "5432:5432"
    volumes:
      - pwm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwm -d pwm_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pwm_pgdata:
