services:
  postgres:
    image: postgres:16-alpine
    container_name: pwm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pwm
      POSTGRES_PASSWORD: pwm_pass
      POSTGRES_DB: pwm_db
    volumes:
      - pwm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwm -d pwm_db"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - pwm_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pwm-backend:latest
    container_name: pwm_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - pwm_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pwm-frontend:latest
    container_name: pwm_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - pwm_net

volumes:
  pwm_pgdata:

networks:
  pwm_net:
    driver: bridge
